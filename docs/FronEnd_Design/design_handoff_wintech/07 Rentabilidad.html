<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wintech · Rentabilidad</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="wintech-shell.css" />
<style>
  .ph{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:14px}
  .ph h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-0.02em;color:var(--ink)}
  .ph .lede{font-size:13px;color:var(--ink-2);margin-top:4px;line-height:1.45}
  .ph .lede b{color:var(--ink);font-weight:600}
  .ph .period{display:flex;gap:6px;background:var(--paper);border:1px solid var(--line-soft);border-radius:8px;padding:4px}
  .ph .period button{border:none;background:transparent;font-family:inherit;font-size:12px;color:var(--ink-2);padding:6px 11px;border-radius:5px;cursor:pointer;font-weight:500}
  .ph .period button.active{background:var(--primary);color:var(--lily);font-weight:600}

  /* Hero: Punto de equilibrio */
  .eq-hero{background:linear-gradient(135deg, #1F3818 0%, #0F1F0A 100%);border-radius:14px;padding:24px 28px;color:var(--lily);margin-bottom:16px;display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center;position:relative;overflow:hidden}
  .eq-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle, rgba(147,176,65,0.18) 0%, transparent 70%)}
  .eq-hero .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--accent);font-weight:600;margin-bottom:6px}
  .eq-hero h2{margin:0 0 4px;font-size:30px;font-weight:600;letter-spacing:-0.015em;line-height:1.15}
  .eq-hero h2 .pct{color:var(--accent);font-family:var(--mono)}
  .eq-hero .sub{font-size:13.5px;color:rgba(255,255,254,0.72);line-height:1.5}
  .eq-hero .sub b{color:var(--accent);font-weight:600;font-family:var(--mono)}

  .eq-gauge{position:relative}
  .eq-gauge .track{height:14px;border-radius:7px;background:rgba(255,255,254,0.08);position:relative;overflow:hidden;border:1px solid rgba(255,255,254,0.12)}
  .eq-gauge .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg, #93B041 0%, #6E8530 100%);border-radius:7px}
  .eq-gauge .marker{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--accent);box-shadow:0 0 0 3px rgba(245,200,66,0.25)}
  .eq-gauge .marker .lbl{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10px;color:var(--accent);font-weight:700;white-space:nowrap;letter-spacing:0.04em}
  .eq-gauge .scale{display:flex;justify-content:space-between;margin-top:8px;font-family:var(--mono);font-size:10.5px;color:rgba(255,255,254,0.5)}
  .eq-gauge .legend{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
  .eq-gauge .lg-cell .l{font-size:9.5px;text-transform:uppercase;letter-spacing:0.06em;color:rgba(255,255,254,0.55);font-weight:600;margin-bottom:3px}
  .eq-gauge .lg-cell .v{font-family:var(--mono);font-size:18px;font-weight:600;color:#fff;letter-spacing:-0.01em}

  /* KPI strip */
  .kpis{display:grid;grid-template-columns:repeat(4, 1fr);gap:12px;margin-bottom:16px}
  .kpi{background:var(--paper);border:1px solid var(--line-soft);border-radius:11px;padding:14px 16px}
  .kpi .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:6px}
  .kpi .lab .ic{width:22px;height:22px;border-radius:6px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center}
  .kpi .v{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--ink);margin-top:6px;letter-spacing:-0.01em;font-variant-numeric:tabular-nums}
  .kpi .v .u{font-size:13px;color:var(--ink-3);margin-right:4px;font-weight:500}
  .kpi .delta{font-size:11.5px;font-family:var(--mono);margin-top:4px;display:inline-flex;align-items:center;gap:4px}
  .kpi .delta.up{color:var(--ok)}
  .kpi .delta.dn{color:var(--crit)}
  .kpi .delta .vs{color:var(--ink-3);margin-left:3px}

  /* Two-column */
  .grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start}

  /* Margen bridge: bruto → neto */
  .panel{background:var(--paper);border:1px solid var(--line-soft);border-radius:12px;overflow:hidden;box-shadow:0 1px 0 rgba(94,90,51,0.03)}
  .panel-h{padding:13px 18px;background:linear-gradient(180deg, var(--paper-2) 0%, var(--paper) 100%);border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px}
  .panel-h h3{margin:0;font-size:13.5px;font-weight:600;color:var(--ink)}
  .panel-h .sub{font-size:11.5px;color:var(--ink-3)}
  .panel-h .grow{flex:1}

  .bridge{padding:20px 22px}
  .bridge .row{display:grid;grid-template-columns:140px 1fr 110px;gap:14px;align-items:center;padding:9px 0;font-size:12.5px}
  .bridge .row .lab{color:var(--ink-2);display:flex;align-items:center;gap:7px}
  .bridge .row .lab .dot{width:9px;height:9px;border-radius:2px}
  .bridge .row .bar-wrap{height:24px;background:var(--paper-2);border-radius:5px;position:relative;overflow:hidden;border:1px solid var(--line-soft)}
  .bridge .row .bar{position:absolute;top:0;bottom:0;border-radius:4px}
  .bridge .row .v{font-family:var(--mono);font-weight:600;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
  .bridge .row.neg .v{color:var(--crit)}
  .bridge .row.pos .v{color:var(--ok)}
  .bridge .row.total{border-top:1.5px solid var(--ink);margin-top:6px;padding-top:14px}
  .bridge .row.total .lab{color:var(--ink);font-weight:700}
  .bridge .row.total .v{font-size:16px;font-weight:700}
  .bridge .row .pct{font-size:10.5px;color:var(--ink-3);margin-left:6px;font-family:var(--mono)}

  .bridge .arrow{text-align:center;color:var(--ink-3);font-size:11px;font-family:var(--mono);padding:4px 0}

  /* Producto rows */
  .prod-row{display:grid;grid-template-columns:1fr 70px 70px 70px 90px;gap:10px;padding:11px 18px;border-bottom:1px solid var(--line-soft);align-items:center;font-size:12.5px;cursor:pointer}
  .prod-row:last-child{border-bottom:none}
  .prod-row:hover{background:var(--paper-2)}
  .prod-row .nm{min-width:0}
  .prod-row .nm .t{font-weight:500;color:var(--ink);font-size:12.5px;line-height:1.3}
  .prod-row .nm .s{font-size:10.5px;color:var(--ink-3);font-family:var(--mono);margin-top:2px}
  .prod-row .num{font-family:var(--mono);font-weight:500;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:12px}
  .prod-row .margin-cell{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
  .prod-row .margin-cell .pct{font-family:var(--mono);font-weight:700;font-size:13px}
  .prod-row .margin-cell .bar{width:60px;height:4px;border-radius:2px;background:var(--paper-2);overflow:hidden;border:1px solid var(--line-soft)}
  .prod-row .margin-cell .bar > span{display:block;height:100%;border-radius:2px}
  .prod-row.crit .margin-cell .pct{color:var(--crit)}
  .prod-row.crit .margin-cell .bar > span{background:var(--crit)}
  .prod-row.warn .margin-cell .pct{color:var(--warn)}
  .prod-row.warn .margin-cell .bar > span{background:var(--warn)}
  .prod-row.ok .margin-cell .pct{color:var(--ok)}
  .prod-row.ok .margin-cell .bar > span{background:linear-gradient(90deg, var(--eq-from), var(--eq-to))}

  .prod-h{display:grid;grid-template-columns:1fr 70px 70px 70px 90px;gap:10px;padding:8px 18px;background:var(--paper-2);border-bottom:1px solid var(--line-soft);font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-3);font-weight:600}
  .prod-h .num{text-align:right}

  /* Alert callout */
  .alert{background:linear-gradient(135deg, #FBE7DC, #F8D5BD);border:1px solid #E5B89E;border-radius:12px;padding:14px 18px;margin-bottom:16px;display:flex;gap:14px;align-items:flex-start}
  .alert .ic{width:36px;height:36px;border-radius:9px;background:var(--crit);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .alert .body{flex:1}
  .alert .t{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:3px}
  .alert .s{font-size:12.5px;color:var(--ink-2);line-height:1.5}
  .alert .s b{color:var(--crit);font-family:var(--mono);font-weight:700}
  .alert .actions{display:flex;gap:8px;margin-top:10px}
  .alert .btn{padding:7px 12px;border-radius:6px;font-size:12px;font-weight:600;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
  .alert .btn.primary{background:var(--ink);color:var(--lily)}

  /* Trend chart */
  .trend-chart{padding:16px 18px;height:200px}
  .trend-chart svg{width:100%;height:100%;overflow:visible}
  .trend-chart .axis{font-size:10px;fill:var(--ink-3);font-family:var(--mono)}

  /* Mix donut + legend */
  .mix-wrap{display:grid;grid-template-columns:140px 1fr;gap:18px;padding:18px;align-items:center}
  .mix-legend{display:flex;flex-direction:column;gap:8px}
  .mix-row{display:grid;grid-template-columns:14px 1fr auto auto;gap:10px;align-items:center;font-size:12px;padding:6px 0;border-bottom:1px dashed var(--line-soft)}
  .mix-row:last-child{border-bottom:none}
  .mix-row .sw{width:12px;height:12px;border-radius:3px}
  .mix-row .nm{color:var(--ink);font-weight:500}
  .mix-row .v{font-family:var(--mono);font-weight:600;color:var(--ink);font-size:12px}
  .mix-row .m{font-family:var(--mono);font-size:11px;color:var(--ink-3);background:var(--paper-2);padding:1px 6px;border-radius:3px;min-width:42px;text-align:center}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="wintech-shell.jsx"></script>

<script type="text/babel">
const PEORES = [
  { sku: "WT-58-7019", nombre: "Marco Wintech 58 · Beige claro", fob: 26.80, landed: 38.40, venta: 39.80, margen: -3.5, vendidas: 14, estado: "crit" },
  { sku: "ACC-JUN-101", nombre: "Junta EPDM marco 58", fob: 0.42, landed: 0.62, venta: 0.85, margen: 12, vendidas: 1840, estado: "warn" },
  { sku: "HRJ-BG-1108", nombre: "Bisagra carga pesada 110mm", fob: 4.10, landed: 5.85, venta: 7.20, margen: 18, vendidas: 95, estado: "warn" },
  { sku: "WT-58-7012", nombre: "Marco Wintech 58 · Símil madera", fob: 28.40, landed: 40.10, venta: 42.10, margen: 22, vendidas: 38, estado: "warn" },
];

const MEJORES = [
  { sku: "HRJ-CRM-2101", nombre: "Cremona Roto NT estándar", fob: 14.20, landed: 18.40, venta: 22.40, margen: 53, vendidas: 220, estado: "ok" },
  { sku: "HRJ-MN-2201", nombre: "Manilla Roto NT Atlas blanca", fob: 9.80, landed: 12.60, venta: 16.40, margen: 48, vendidas: 180, estado: "ok" },
  { sku: "WT-70-3201", nombre: "Marco Wintech 70 · Blanco", fob: 30.40, landed: 38.20, venta: 45.80, margen: 42, vendidas: 142, estado: "ok" },
  { sku: "WT-58-7001", nombre: "Marco Wintech 58 · Blanco", fob: 26.10, landed: 33.40, venta: 39.40, margen: 38, vendidas: 88, estado: "ok" },
];

const MIX = [
  { nm: "Perfiles Wintech 58", color: "#1F3818", venta: 168400, margen: 39 },
  { nm: "Perfiles Wintech 70", color: "#3F5A2A", venta: 124200, margen: 42 },
  { nm: "Herrajes Roto NT", color: "#93B041", venta: 92800, margen: 51 },
  { nm: "Accesorios y juntas", color: "#F5C842", venta: 28600, margen: 28 },
];

function App(){
  const [active, setActive] = React.useState("Rentabilidad");
  const [period, setPeriod] = React.useState("mes");

  const totalVentas = MIX.reduce((a, b) => a + b.venta, 0);

  return (
    <div className="app" data-screen-label="06 Rentabilidad">
      <Sidebar active={active} onNav={setActive} />
      <div className="main">
        <Topbar
          crumbs={["Wintech AR", "Rentabilidad", "Mes en curso"]}
          actions={<>
            <button className="tb-btn"><IcDown size={14} /> Exportar</button>
            <button className="tb-btn"><IcCalc size={14} /> Simular precios</button>
            <button className="tb-btn primary"><IcChart size={14} /> Cerrar mes</button>
          </>}
        />

        <div className="content">
          <div className="ph">
            <div>
              <h1>Rentabilidad · Abril 2026</h1>
              <div className="lede">Vas <b>USD 414.000</b> facturados · margen bruto <b>42%</b> · margen neto <b>14%</b> · <b>1 producto vendiéndose a pérdida</b></div>
            </div>
            <div className="period">
              {[["sem", "Semana"], ["mes", "Mes"], ["tri", "Trimestre"], ["año", "Año"]].map(([k, l]) => (
                <button key={k} className={period === k ? "active" : ""} onClick={() => setPeriod(k)}>{l}</button>
              ))}
            </div>
          </div>

          {/* Hero: Punto de equilibrio */}
          <div className="eq-hero">
            <div>
              <div className="lab">Punto de equilibrio · Abril</div>
              <h2>Cubriste tu equilibrio el <span className="pct">22 abr</span></h2>
              <div className="sub">Necesitabas facturar <b>USD 285.000</b> para cubrir gastos fijos. Llevás <b>USD 414.000</b> al 30/abr · todo lo arriba del equilibrio es <b>USD 54.000</b> de utilidad neta acumulada.</div>
            </div>
            <div className="eq-gauge">
              <div className="track">
                <div className="fill" style={{ width: "85%" }}></div>
                <div className="marker" style={{ left: "58.7%" }}>
                  <span className="lbl">equilibrio · 285k</span>
                </div>
              </div>
              <div className="scale">
                <span>$0</span>
                <span>$485k</span>
              </div>
              <div className="legend">
                <div className="lg-cell">
                  <div className="l">Facturado</div>
                  <div className="v">USD 414.000</div>
                </div>
                <div className="lg-cell">
                  <div className="l">Utilidad neta</div>
                  <div className="v" style={{ color: "var(--accent)" }}>+ USD 54.000</div>
                </div>
              </div>
            </div>
          </div>

          {/* KPIs */}
          <div className="kpis">
            <div className="kpi">
              <div className="lab"><span className="ic"><IcDlr size={12} /></span>Ventas brutas</div>
              <div className="v"><span className="u">USD</span>414.000</div>
              <div className="delta up"><IcArrR size={11} style={{ transform: "rotate(-45deg)" }} />+18% <span className="vs">vs marzo</span></div>
            </div>
            <div className="kpi">
              <div className="lab"><span className="ic"><IcChart size={12} /></span>Margen bruto</div>
              <div className="v">42<span style={{ fontSize: 18, color: "var(--ink-3)" }}>%</span></div>
              <div className="delta up"><IcArrR size={11} style={{ transform: "rotate(-45deg)" }} />+1.2pp <span className="vs">vs marzo</span></div>
            </div>
            <div className="kpi">
              <div className="lab"><span className="ic"><IcBars size={12} /></span>Margen neto</div>
              <div className="v">14<span style={{ fontSize: 18, color: "var(--ink-3)" }}>%</span></div>
              <div className="delta dn"><IcArrR size={11} style={{ transform: "rotate(45deg)" }} />−0.8pp <span className="vs">vs marzo</span></div>
            </div>
            <div className="kpi">
              <div className="lab"><span className="ic"><IcCalc size={12} /></span>Utilidad neta</div>
              <div className="v"><span className="u">USD</span>54.000</div>
              <div className="delta up"><IcArrR size={11} style={{ transform: "rotate(-45deg)" }} />+12% <span className="vs">vs marzo</span></div>
            </div>
          </div>

          {/* Alert: vendiendo a pérdida */}
          <div className="alert">
            <div className="ic"><IcAlert size={18} /></div>
            <div className="body">
              <div className="t">1 producto se está vendiendo por debajo del costo desembarcado</div>
              <div className="s">
                <b>WT-58-7019 · Marco Wintech 58 Beige claro</b> — landed cost <b>USD 38.40</b>, precio venta <b>USD 39.80</b> · margen <b>−3.5%</b>. Vendiste <b>14 barras</b> en abril (pérdida acumulada ~USD 49). El landed cost subió tras la última importación por el reparto del flete.
              </div>
              <div className="actions">
                <button className="btn primary"><IcCalc size={12} /> Recalcular precio sugerido</button>
                <button className="btn"><IcSrch size={12} /> Ver detalle del SKU</button>
                <button className="btn">Ignorar este mes</button>
              </div>
            </div>
          </div>

          {/* Grid: bridge bruto→neto + mix */}
          <div className="grid" style={{ marginBottom: 14 }}>
            <div className="panel">
              <div className="panel-h">
                <h3>Bruto → Neto · cómo se construye el margen</h3>
                <span className="sub">USD del mes</span>
              </div>
              <div className="bridge">
                <BR lab="Ventas brutas" v="+414.000" pct="100%" w="100%" color="var(--primary)" />
                <BR lab="Costo FOB productos" v="−196.000" pct="47%" w="47%" color="var(--crit)" neg />
                <BR lab="Logística desembarcada" v="−42.500" pct="10%" w="10%" color="var(--warn)" neg />
                <BR lab="Aranceles e impuestos" v="−21.500" pct="5%" w="5%" color="var(--warn)" neg />
                <div className="row total">
                  <div className="lab">= Margen bruto</div>
                  <div></div>
                  <div className="v" style={{ color: "var(--ok)" }}>+ USD 154.000<span className="pct">42%</span></div>
                </div>
                <div style={{ height: 8 }}></div>
                <BR lab="Sueldos y cargas" v="−42.000" pct="10%" w="10%" color="var(--ink-3)" neg />
                <BR lab="Alquiler depósito" v="−18.000" pct="4%" w="4%" color="var(--ink-3)" neg />
                <BR lab="Combustible y logística local" v="−14.000" pct="3%" w="3%" color="var(--ink-3)" neg />
                <BR lab="Servicios y otros" v="−11.000" pct="3%" w="3%" color="var(--ink-3)" neg />
                <BR lab="Impuestos sobre venta" v="−15.000" pct="4%" w="4%" color="var(--ink-3)" neg />
                <div className="row total">
                  <div className="lab">= Utilidad neta</div>
                  <div></div>
                  <div className="v" style={{ color: "var(--ok)" }}>+ USD 54.000<span className="pct">14%</span></div>
                </div>
              </div>
            </div>

            <div className="panel">
              <div className="panel-h">
                <h3>Mix de ventas por familia</h3>
                <span className="sub">% del total + margen propio</span>
              </div>
              <div className="mix-wrap">
                <Donut data={MIX} total={totalVentas} />
                <div className="mix-legend">
                  {MIX.map(m => (
                    <div className="mix-row" key={m.nm}>
                      <div className="sw" style={{ background: m.color }}></div>
                      <div className="nm">{m.nm}</div>
                      <div className="v">{Math.round(m.venta / 1000)}k</div>
                      <div className="m" style={{ background: m.margen >= 40 ? "var(--teal-soft)" : m.margen >= 30 ? "var(--accent-soft)" : "#FBE7DC", color: m.margen >= 40 ? "var(--ok)" : m.margen >= 30 ? "#7a5e10" : "var(--crit)" }}>{m.margen}%</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>

          {/* Trend chart full-width */}
          <div className="panel" style={{ marginBottom: 14 }}>
            <div className="panel-h">
              <h3>Evolución · últimos 12 meses</h3>
              <span className="sub">Ventas · margen bruto · margen neto</span>
              <div className="grow"></div>
              <div style={{ display: "flex", gap: 14, fontSize: 11, fontFamily: "var(--mono)", color: "var(--ink-3)" }}>
                <span><span style={{ display: "inline-block", width: 14, height: 3, background: "var(--primary)", verticalAlign: "middle", marginRight: 6 }}></span>Ventas</span>
                <span><span style={{ display: "inline-block", width: 14, height: 3, background: "var(--teal)", verticalAlign: "middle", marginRight: 6 }}></span>Margen bruto</span>
                <span><span style={{ display: "inline-block", width: 14, height: 3, background: "var(--accent-2)", verticalAlign: "middle", marginRight: 6 }}></span>Margen neto</span>
              </div>
            </div>
            <div className="trend-chart">
              <TrendChart />
            </div>
          </div>

          {/* Productos: peor / mejor margen */}
          <div className="grid">
            <div className="panel">
              <div className="panel-h">
                <h3>⚠ Peor margen · revisar precios</h3>
                <span className="sub">4 productos</span>
              </div>
              <div className="prod-h">
                <span>Producto</span>
                <span className="num">FOB</span>
                <span className="num">Landed</span>
                <span className="num">Venta</span>
                <span className="num">Margen</span>
              </div>
              {PEORES.map(p => <ProdRow key={p.sku} p={p} />)}
            </div>

            <div className="panel">
              <div className="panel-h">
                <h3>★ Mejor margen · top performers</h3>
                <span className="sub">4 productos</span>
              </div>
              <div className="prod-h">
                <span>Producto</span>
                <span className="num">FOB</span>
                <span className="num">Landed</span>
                <span className="num">Venta</span>
                <span className="num">Margen</span>
              </div>
              {MEJORES.map(p => <ProdRow key={p.sku} p={p} />)}
            </div>
          </div>

          <div className="app-foot">
            <span>Rentabilidad · Abril 2026</span>
            <span>·</span>
            <span>Datos en USD · TC referencia $1.220 · cierre el último día del mes</span>
            <div className="grow"></div>
            <span>Última sincronización · hace 3 minutos</span>
          </div>
        </div>
      </div>
    </div>
  );
}

function BR({ lab, v, pct, w, color, neg, pos }){
  return (
    <div className={`row ${neg ? "neg" : pos ? "pos" : ""}`}>
      <div className="lab"><span className="dot" style={{ background: color }}></span>{lab}</div>
      <div className="bar-wrap">
        <div className="bar" style={{ width: w, background: color, opacity: 0.85, left: 0 }}></div>
      </div>
      <div className="v">{v}<span className="pct">{pct}</span></div>
    </div>
  );
}

function ProdRow({ p }){
  const pctW = Math.min(100, Math.max(0, ((p.margen + 10) / 70) * 100));
  return (
    <div className={`prod-row ${p.estado}`}>
      <div className="nm">
        <div className="t">{p.nombre}</div>
        <div className="s">{p.sku} · {p.vendidas.toLocaleString("es-AR")}u vendidas</div>
      </div>
      <div className="num">{p.fob.toFixed(2)}</div>
      <div className="num">{p.landed.toFixed(2)}</div>
      <div className="num">{p.venta.toFixed(2)}</div>
      <div className="margin-cell">
        <span className="pct">{p.margen > 0 ? "+" : ""}{p.margen}%</span>
        <span className="bar"><span style={{ width: pctW + "%" }}></span></span>
      </div>
    </div>
  );
}

function Donut({ data, total }){
  const R = 56, r = 36, cx = 70, cy = 70;
  let acc = 0;
  const segs = data.map(d => {
    const start = acc / total;
    acc += d.venta;
    const end = acc / total;
    return { ...d, start, end };
  });
  const arc = (s, e, R, r) => {
    const a0 = s * Math.PI * 2 - Math.PI / 2;
    const a1 = e * Math.PI * 2 - Math.PI / 2;
    const large = (e - s) > 0.5 ? 1 : 0;
    const x0 = cx + R * Math.cos(a0), y0 = cy + R * Math.sin(a0);
    const x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
    const xi1 = cx + r * Math.cos(a1), yi1 = cy + r * Math.sin(a1);
    const xi0 = cx + r * Math.cos(a0), yi0 = cy + r * Math.sin(a0);
    return `M ${x0} ${y0} A ${R} ${R} 0 ${large} 1 ${x1} ${y1} L ${xi1} ${yi1} A ${r} ${r} 0 ${large} 0 ${xi0} ${yi0} Z`;
  };
  return (
    <svg viewBox="0 0 140 140" width="140" height="140">
      {segs.map(s => <path key={s.nm} d={arc(s.start, s.end, R, r)} fill={s.color} />)}
      <text x={cx} y={cy - 4} textAnchor="middle" fontSize="11" fill="var(--ink-3)" fontFamily="var(--mono)" style={{ textTransform: "uppercase", letterSpacing: "0.05em" }}>Total</text>
      <text x={cx} y={cy + 12} textAnchor="middle" fontSize="16" fontWeight="700" fill="var(--ink)" fontFamily="var(--mono)">{Math.round(total / 1000)}k</text>
    </svg>
  );
}

function TrendChart(){
  const months = ["may", "jun", "jul", "ago", "sep", "oct", "nov", "dic", "ene", "feb", "mar", "abr"];
  const ventas = [285, 298, 312, 304, 326, 348, 362, 380, 354, 372, 350, 414];
  const bruto = [38, 39, 40, 38, 41, 42, 41, 43, 40, 41, 41, 42];
  const neto = [12, 13, 14, 13, 15, 15, 14, 16, 13, 14, 15, 14];
  const W = 800, H = 180, padL = 40, padR = 30, padT = 14, padB = 26;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const xs = (i) => padL + (i / (months.length - 1)) * innerW;
  const ys = (v, max) => padT + innerH - (v / max) * innerH;
  const maxVent = 450;
  const path = (data, max) => data.map((v, i) => (i ? "L" : "M") + xs(i) + " " + ys(v, max)).join(" ");

  return (
    <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
      {[0, 100, 200, 300, 400].map(t => (
        <g key={t}>
          <line x1={padL} y1={ys(t, maxVent)} x2={padL + innerW} y2={ys(t, maxVent)} stroke="var(--line-soft)" strokeDasharray="2 3" />
          <text x={padL - 8} y={ys(t, maxVent) + 3} className="axis" textAnchor="end">{t}k</text>
        </g>
      ))}
      {/* margin pct axis (right) */}
      {[0, 25, 50].map(t => (
        <text key={t} x={padL + innerW + 6} y={ys(t * 8, maxVent) + 3} className="axis" textAnchor="start" fill="var(--accent-2)">{t}%</text>
      ))}

      {/* ventas area */}
      <path d={path(ventas, maxVent) + ` L ${xs(months.length - 1)} ${padT + innerH} L ${xs(0)} ${padT + innerH} Z`} fill="var(--primary)" opacity="0.08" />
      <path d={path(ventas, maxVent)} fill="none" stroke="var(--primary)" strokeWidth="2.5" strokeLinejoin="round" />
      {ventas.map((v, i) => <circle key={i} cx={xs(i)} cy={ys(v, maxVent)} r="3" fill="var(--primary)" />)}

      {/* margen bruto (scaled to maxVent via *8 for pct visual) */}
      <path d={path(bruto.map(v => v * 8), maxVent)} fill="none" stroke="var(--teal)" strokeWidth="2" strokeDasharray="4 3" />
      {/* margen neto */}
      <path d={path(neto.map(v => v * 8), maxVent)} fill="none" stroke="var(--accent-2)" strokeWidth="2" strokeDasharray="4 3" />

      {/* x labels */}
      {months.map((m, i) => (
        <text key={m} x={xs(i)} y={H - 8} className="axis" textAnchor="middle" fill={i === months.length - 1 ? "var(--primary)" : "var(--ink-3)"} fontWeight={i === months.length - 1 ? 700 : 400}>{m}</text>
      ))}

      {/* highlight last point */}
      <circle cx={xs(months.length - 1)} cy={ys(ventas[ventas.length - 1], maxVent)} r="5" fill="var(--accent)" stroke="var(--primary)" strokeWidth="2" />
      <text x={xs(months.length - 1) - 4} y={ys(ventas[ventas.length - 1], maxVent) - 10} className="axis" textAnchor="end" fill="var(--ink)" fontWeight="700">414k</text>
    </svg>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
