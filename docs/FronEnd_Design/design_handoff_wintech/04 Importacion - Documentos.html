  .mini-hero h1{margin:0;font-size:18px;font-family:var(--mono);font-weight:600;color:var(--ink)}
  .mini-hero .meta{font-size:12px;color:var(--ink-3);margin-top:2px}
  .mini-hero .tag{font-size:10.5px;background:var(--accent);color:var(--ink);padding:2px 8px;border-radius:4px;font-weight:600;text-transform:uppercase;letter-spacing:0.02em;margin-left:8px}

  /* Layout */
  .grid{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:start}

  .stage-div .num{width:24px;height:24px;border-radius:6px;background:var(--primary);color:#fff;font-family:var(--mono);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}

  .stage-div .num.active{background:var(--accent);color:var(--ink)}
  .stage-div .num.up{background:var(--paper);color:var(--ink-3);border:1px dashed var(--line-2)}
  .stage-div h4{margin:0;font-size:12px;font-weight:600;color:var(--ink);text-transform:uppercase;letter-spacing:0.04em}
  .stage-div .when{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
  .stage-div .grow{flex:1}
  .stage-div .ct{font-size:10.5px;color:var(--ink-3);font-family:var(--mono);background:var(--paper);padding:2px 7px;border-radius:4px;border:1px solid var(--line-soft)}

  .msg.in .av{background:linear-gradient(135deg, var(--teal), var(--primary))}

  .msg .head .arrow{font-size:11px;color:var(--ink-3)}
  .msg .head .other{font-size:12px;color:var(--ink-2)}
  .msg .head .when{font-size:11px;color:var(--ink-3);font-family:var(--mono);margin-left:auto}
  .msg .head .dir{font-size:9.5px;padding:1px 6px;border-radius:3px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;font-family:var(--mono)}

  .msg.in .dir{background:var(--teal-soft);color:var(--primary)}
  .msg .subj{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:4px;line-height:1.35}

  .att-chip .ic-f{width:26px;height:26px;border-radius:5px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:700;font-family:var(--mono);flex-shrink:0}

  .att-chip .ic-f.xls{background:#1F7A3D}
  .att-chip .ic-f.doc{background:#2E5BBA}
  .att-chip .ic-f.img{background:var(--warn)}
  .att-chip .nm{font-weight:500;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .att-chip .meta{font-size:10.5px;color:var(--ink-3);font-family:var(--mono)}
  .att-chip .v{font-size:10px;background:var(--accent);color:var(--ink);padding:1px 6px;border-radius:3px;font-family:var(--mono);font-weight:700;letter-spacing:0.02em}
  .att-chip.superseded{opacity:0.55}
  .att-chip.superseded .nm{text-decoration:line-through;color:var(--ink-3)}

  /* Right: documents library */
  .lib{position:sticky;top:78px;background:var(--paper);border:1px solid var(--line-soft);border-radius:12px;overflow:hidden;box-shadow:0 1px 0 rgba(94,90,51,0.03);max-height:calc(100vh - 100px);display:flex;flex-direction:column}
  .lib-h{padding:13px 18px;background:linear-gradient(180deg, var(--paper-2) 0%, var(--paper) 100%);border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px}
  .lib-h h3{margin:0;font-size:13.5px;font-weight:600;color:var(--ink)}
  .lib-h .sub{font-size:11.5px;color:var(--ink-3)}
  .lib-h .grow{flex:1}
  .lib-h .filt{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line-soft);border-radius:7px;padding:3px}

  .lib-h .filt button.active{background:var(--primary);color:var(--lily)}

  .lib-search{padding:10px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:8px;background:var(--paper-2)}
  .lib-search input{flex:1;border:1px solid var(--line-soft);background:var(--paper);padding:6px 10px;border-radius:6px;font-family:inherit;font-size:12.5px;color:var(--ink);outline:none}

  .lib-search input:focus{border-color:var(--primary)}

  .lib-body{overflow-y:auto;flex:1}
  .lib-stage{padding:9px 18px 6px;font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.06em;font-weight:600;background:var(--paper-2);border-bottom:1px solid var(--line-soft);position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px}
  .lib-stage .grow{flex:1}
  .lib-stage .ct{font-family:var(--mono);font-size:10px;color:var(--ink-3);font-weight:600;letter-spacing:0}

  .lib-row{padding:11px 18px;display:grid;grid-template-columns:30px 1fr auto;gap:10px;border-bottom:1px solid var(--line-soft);align-items:center;cursor:pointer;font-size:12.5px}
  .lib-row:hover{background:var(--paper-2)}
  .lib-row .ic-f{width:28px;height:28px;border-radius:6px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;font-family:var(--mono);flex-shrink:0}
  .lib-row .ic-f.pdf{background:var(--crit)}
  .lib-row .ic-f.xls{background:#1F7A3D}
  .lib-row .ic-f.doc{background:#2E5BBA}
  .lib-row .body{min-width:0}
  .lib-row .nm{font-weight:500;color:var(--ink);font-size:12.5px;display:flex;align-items:center;gap:6px}
  .lib-row .nm .v{font-size:9.5px;background:var(--paper-2);color:var(--ink-2);padding:1px 5px;border-radius:3px;font-family:var(--mono);font-weight:700;border:1px solid var(--line-soft);letter-spacing:0.02em}
  .lib-row .nm .v.active{background:var(--accent);color:var(--ink);border-color:var(--accent-2)}
  .lib-row .meta{font-size:10.5px;color:var(--ink-3);font-family:var(--mono);margin-top:2px;display:flex;gap:6px;align-items:center}
  .lib-row .dir{font-size:9px;font-family:var(--mono);font-weight:700;letter-spacing:0.04em;text-transform:uppercase}
  .lib-row .dir.out{color:#7a5e10}
  .lib-row .dir.in{color:var(--primary)}
  .lib-row .actions{display:flex;gap:4px;opacity:0;transition:opacity 0.12s}
  .lib-row:hover .actions{opacity:1}
  .lib-row .actions button{width:24px;height:24px;border:1px solid var(--line-soft);background:var(--paper);border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-2);font-family:inherit}
  .lib-row .actions button:hover{border-color:var(--primary);color:var(--primary)}

  /* Versions stack indicator */
  .ver-stack{position:relative;font-size:9px;font-family:var(--mono);color:var(--ink-3);background:var(--paper-2);padding:1px 5px;border-radius:3px;border:1px solid var(--line-soft);font-weight:600}
  .ver-stack:hover{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}

  /* Compose draft */
  .compose{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:14px 18px;margin-top:14px;display:flex;gap:12px;align-items:flex-start}
  .compose .ic{width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .compose .body{flex:1}
  .compose .body .t{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:3px}
  .compose .body .s{font-size:12px;color:var(--ink-2);line-height:1.5}
  .compose .body .actions{display:flex;gap:8px;margin-top:10px}
  .compose .btn-mini{padding:6px 11px;border-radius:6px;font-size:12px;font-weight:500;border:1px solid var(--line-soft);background:var(--paper);color:var(--ink);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
  .compose .btn-mini.primary{background:var(--primary);color:var(--lily);border-color:var(--primary)}
</style>

              <div className="msg out">

                <div className="body">
                  <div className="head">
                    <span className="who">Lucas P.</span>
                    <span className="arrow">→</span>
                    <span className="other">Mehmet · Adopen</span>
                    <span className="dir">Enviado</span>
                    <span className="when">08 dic 25 · 17:35</span>

              {/* Compose draft */}

                <LibRow type="pdf" name="Poliza_Seguro_Allianz" v="v1" active dir="in" meta="124 KB · 28 dic · Allianz" />

          </div>

          <div className="app-foot">
            <span>IMP-2026-005 · Documentos</span>

            <span>Sincronizado con buzón <b style={{ color: "var(--ink)" }}>imports@wintech.app</b></span>

}

function Att({ type, name, meta, v, superseded, auto }){
  return (
    <div className={`att-chip ${superseded ? "superseded" : ""}`}>
      <div className={`ic-f ${type}`}>{type.toUpperCase()}</div>
      <div className="nm">{name}</div>
      <div className="meta">{meta}</div>
      {v && <span className="v" style={ auto ? { background: "var(--teal-soft)", color: "var(--primary)" } : superseded ? { background: "var(--paper-2)", color: "var(--ink-3)" } : null }>{v}</span>}
    </div>
  );
}

function Stage({ label, ct, pending }){
  return (
    <div className="lib-stage" style={ pending ? { background: "#FFF8E0" } : null }>
      <span>{label}</span>
      <div className="grow"></div>
      <span className="ct">{ct} archivo{ct === 1 ? "" : "s"}</span>
    </div>
  );
}

function LibRow({ type, name, v, active, dir, meta, versions, pending }){
  return (
    <div className="lib-row" style={ pending ? { opacity: 0.55 } : null }>
      <div className={`ic-f ${type}`}>{type.toUpperCase()}</div>
      <div className="body">
        <div className="nm">
          {name}
          {v && v !== "—" && <span className={`v ${active ? "active" : ""}`}>{v}</span>}
          {versions && versions > 1 && <span className="ver-stack" title={`${versions} versiones · click para ver historial`}>+{versions - 1} prev.</span>}
        </div>
        <div className="meta">
          {dir === "out" && <span className="dir out">↑ enviado</span>}
          {dir === "in" && <span className="dir in">↓ recibido</span>}
          {dir === "—" && <span style={{ color: "var(--warn)", fontWeight: 600 }}>pendiente</span>}
          {dir !== "—" && <span>·</span>}
          <span>{meta}</span>
        </div>
      </div>
      <div className="actions">
        <button title="Ver"><IcSrch size={11} /></button>
        <button title="Descargar"><IcDown size={11} /></button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
